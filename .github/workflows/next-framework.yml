name: Platon Next framework build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install prisma generate
      - name: Build with synthetic settings and test the production HTTP handlers
        run: |
          set -euo pipefail
          node tests/framework/build-and-smoke.cjs 2>&1 | tee framework-build.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: platon-framework-${{ github.run_id }}
          path: framework-build.txt
          retention-days: 14
